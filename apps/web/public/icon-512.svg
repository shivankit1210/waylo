<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="wayloGrad512" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#wayloGrad512)" />

  <!-- Compass Outer Ring -->
  <circle cx="256" cy="256" r="165" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-opacity="0.3" />
  <circle cx="256" cy="256" r="144" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-opacity="0.5" stroke-dasharray="8 12" />

  <!-- Compass Cardinal Ticks -->
  <line x1="256" y1="80" x2="256" y2="108" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  <line x1="256" y1="404" x2="256" y2="432" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  <line x1="80" y1="256" x2="108" y2="256" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
  <line x1="404" y1="256" x2="432" y2="256" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />

  <!-- Compass Needles -->
  <!-- North Needle (Crimson Red) -->
  <polygon points="256,134 288,256 256,240" fill="#EF4444" />
  <polygon points="256,134 224,256 256,240" fill="#F87171" />

  <!-- South Needle (Snow White) -->
  <polygon points="256,378 288,256 256,272" fill="#E2E8F0" />
  <polygon points="256,378 224,256 256,272" fill="#FFFFFF" />

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="18" fill="#0F172A" />
  <circle cx="256" cy="256" r="10" fill="#38BDF8" />
</svg>
